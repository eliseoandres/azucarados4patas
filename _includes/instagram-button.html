{%- comment -%}
  Uso: {% include instagram-button.html label="Texto" style="coral" %}
  style: coral (default) | azul | blanco
{%- endcomment -%}
<a class="btn btn--{{ include.style | default: 'coral' }}" href="{{ site.instagram_url }}" target="_blank" rel="noopener">
  <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/>
  </svg>
  <span>{{ include.label | default: "Seguinos en Instagram" }}</span>
  <span class="sr-only">(se abre en una pestaña nueva)</span>
</a>
